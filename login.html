<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Wright Cut</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="card auth-card">
    <div class="card-center" style="margin-bottom: 1rem;">
      <img src="images/logo.jpg" alt="Logo" style="width: 80px; border-radius: 50%;">
      <h1 class="title" style="margin-top: 0.5rem;">Wright Cut Login</h1>
      <p class="text-muted" style="font-size: 0.85rem;"></p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="loginEmail" class="form-control" required placeholder="name@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" class="form-control" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-full">Login</button>
    </form>

    <div class="card-center" style="margin-top: 1rem;">
      <button type="button" onclick="handleGoogleSSO()" class="btn btn-secondary btn-full">Continue with Google (SSO)</button>
      <p class="text-muted" style="margin-top: 1rem; font-size: 0.85rem;">
        Need an account? <a href="register.html" style="color: var(--primary);">Register here</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { auth, db, checkIsAdmin, handleGoogleSSO } from "./script.js";
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value.trim();
      const pass = document.getElementById("loginPassword").value;

      try {
        const userCred = await signInWithEmailAndPassword(auth, email, pass);
        const signedInEmail = userCred.user.email;

        // 1. Check if email is in the 2 designated owner emails
        let isUserAdmin = checkIsAdmin(signedInEmail);

        // 2. Also check if the user was promoted to admin inside Firestore
        try {
          const userDoc = await getDoc(doc(db, "users", userCred.user.uid));
          if (userDoc.exists() && userDoc.data().role === "admin") {
            isUserAdmin = true;
          }
        } catch(e) {}

        if (isUserAdmin) {
          window.location.href = "admin-dashboard.html";
        } else {
          window.location.href = "index.html";
        }
      } catch (err) {
        alert("Login failed: " + err.message);
      }
    });
  </script>
</body>
</html>
