<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Wright Cut</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="card auth-card">
    <div class="card-center" style="margin-bottom: 1rem;">
      <img src="images/logo.jpg" alt="Logo" style="width: 80px; border-radius: 50%;">
      <h1 class="title" style="margin-top: 0.5rem;">Wright Cut Login</h1>
    </div>

    <div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="loginEmail" class="form-control" placeholder="Please Enter Your Email Address">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" class="form-control" placeholder="Enter Your Passwored">
      </div>
      
      <button type="button" class="btn btn-full" id="loginSubmitBtn">Login</button>
    </div>

    <div class="card-center" style="margin-top: 1rem;">
      <button type="button" id="googleSsoBtn" class="btn btn-secondary btn-full">Continue with Google (SSO)</button>
      <p class="text-muted" style="margin-top: 1rem; font-size: 0.85rem;">
        Need an account? <a href="register.html" style="color: var(--primary);">Register here</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCG94vYKYSHrHqJpui1kKeipAiKlyvKH8A",
      authDomain: "wright-cut-db.firebaseapp.com",
      projectId: "wright-cut-db",
      storageBucket: "wright-cut-db.firebasestorage.app",
      messagingSenderId: "210876408255",
      appId: "1:210876408255:web:52bce253aebf4ed38e010a"
    };

    const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApps()[0];
    const auth = getAuth(app);
    const db = getFirestore(app);

    const PRIMARY_ADMIN_EMAILS = [
      "kagisogeorge09@gmail.com",
      "admin@wrightcut.com"
    ];

    function checkIsAdmin(email) {
      if (!email) return false;
      const cleanEmail = email.toLowerCase().trim();
      return (
        PRIMARY_ADMIN_EMAILS.includes(cleanEmail) ||
        cleanEmail.includes("kagiso") ||
        cleanEmail.includes("boikhutso")
      );
    }

    function computeInitials(fullName, email) {
      if (fullName && fullName.trim().length > 0) {
        const parts = fullName.trim().split(/\s+/);
        if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
        return parts[0].substring(0, 2).toUpperCase();
      }
      if (email) {
        const prefix = email.split("@")[0].replace(/[^a-zA-Z]/g, "");
        if (prefix.length >= 2) return prefix.substring(0, 2).toUpperCase();
        return (prefix[0] || "W").toUpperCase() + "C";
      }
      return "WC";
    }

    const loginBtn = document.getElementById("loginSubmitBtn");
    loginBtn.addEventListener("click", async () => {
      const email = document.getElementById("loginEmail").value.trim();
      const pass = document.getElementById("loginPassword").value;

      if (!email || !pass) {
        alert("Please enter both your email address and password.");
        return;
      }

      loginBtn.innerText = "Signing in...";
      loginBtn.disabled = true;

      try {
        const userCred = await signInWithEmailAndPassword(auth, email, pass);
        const user = userCred.user;

        let isUserAdmin = checkIsAdmin(user.email);
        let displayName = user.displayName || "";

        try {
          const userDoc = await getDoc(doc(db, "users", user.uid));
          if (userDoc.exists()) {
            const data = userDoc.data();
            if (data.name) displayName = data.name;
            if (data.role === "admin") isUserAdmin = true;
          }
        } catch (e) {
          console.log("Profile lookup:", e);
        }

        // Activate session
        sessionStorage.setItem("wc_session_active", "true");
        localStorage.setItem("wc_cached_user", JSON.stringify({
          email: user.email,
          name: displayName,
          initials: computeInitials(displayName, user.email),
          isAdmin: isUserAdmin
        }));

        if (isUserAdmin) {
          window.location.href = "admin-dashboard.html";
        } else {
          window.location.href = "index.html";
        }
      } catch (err) {
        alert("Login failed: " + err.message);
        loginBtn.innerText = "Login";
        loginBtn.disabled = false;
      }
    });

    document.getElementById("googleSsoBtn").addEventListener("click", async () => {
      const provider = new GoogleAuthProvider();
      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        let isUserAdmin = checkIsAdmin(user.email);

        try {
          const userDoc = await getDoc(doc(db, "users", user.uid));
          if (userDoc.exists() && userDoc.data().role === "admin") {
            isUserAdmin = true;
          }
        } catch (e) {}

        sessionStorage.setItem("wc_session_active", "true");
        localStorage.setItem("wc_cached_user", JSON.stringify({
          email: user.email,
          name: user.displayName || "",
          initials: computeInitials(user.displayName || "", user.email),
          isAdmin: isUserAdmin
        }));

        if (isUserAdmin) {
          window.location.href = "admin-dashboard.html";
        } else {
          window.location.href = "index.html";
        }
      } catch (error) {
        alert("Google Sign-In Error: " + error.message);
      }
    });
  </script>
</body>
</html>
