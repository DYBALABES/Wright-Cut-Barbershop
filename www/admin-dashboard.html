<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Wright Cut</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- EmailJS SDK Integration -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>
  <nav>
    <a href="index.html" class="brand">
      <img src="images/logo.jpg" alt="Logo">
      <span>WRIGHT CUT ADMIN</span>
    </a>
    <div class="nav-links" id="navLinks">
      <a href="index.html">View Main Site</a>
      <a href="admin-dashboard.html" class="active">Appointments Table</a>
      <button onclick="handleLogout()">Sign Out</button>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <div class="dashboard-header">
        <h1 class="title">Live Appointments</h1>
        <span class="manager-badge">Manager: <strong id="userDisplay">Loading...</strong></span>
      </div>
      

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Client Email</th>
              <th>Client Phone</th>
              <th>Service</th>
              <th>Date & Time</th>
              <th>Status</th>
              <th>Actions (Email & SMS)</th>
            </tr>
          </thead>
          <tbody id="appointmentsTableBody">
            <!-- Firestore records populate dynamically -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <footer>&copy; 2026 Wright Cut Barbershop</footer>

  <script type="module">
    import { auth, db } from "./script.js";
    import { collection, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    try {
      if (window.emailjs) {
        emailjs.init({ publicKey: "KVC0ojs2Z06ZQbIxP" });
      }
    } catch (e) {
      console.warn("EmailJS init warning:", e);
    }

    async function loadAppointments() {
      const tbody = document.getElementById("appointmentsTableBody");
      tbody.innerHTML = "<tr><td colspan='6'>Fetching records from Firestore cloud...</td></tr>";

      try {
        const querySnapshot = await getDocs(collection(db, "bookings"));
        tbody.innerHTML = "";

        if (querySnapshot.empty) {
          tbody.innerHTML = "<tr><td colspan='6'>No active appointments recorded in the cloud.</td></tr>";
          return;
        }

        querySnapshot.forEach((docItem) => {
          const item = docItem.data();
          const tr = document.createElement("tr");
          const phone = item.customerPhone || "0820000000";
          const email = item.customerEmail || "client@wrightcut.com";

          tr.innerHTML = `
            <td>${email}</td>
            <td><strong>${phone}</strong></td>
            <td>${item.service}</td>
            <td>${item.date} @ ${item.time}</td>
            <td><span class="status-badge status-${item.status}">${item.status}</span></td>
            <td>
              <div class="action-btn-group">
                <button class="btn-action-success" 
                  onclick="processDecision('${docItem.id}', 'Accepted', '${email}', '${phone}', '${item.service}', '${item.date}', '${item.time}')">
                  Accept (SMS & Email)
                </button>
                <button class="btn-action-danger" 
                  onclick="processDecision('${docItem.id}', 'Declined', '${email}', '${phone}', '${item.service}', '${item.date}', '${item.time}')">
                  Decline (SMS & Email)
                </button>
              </div>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan='6' class='text-danger'>Failed to load records: ${err.message}</td></tr>`;
      }
    }

    window.processDecision = async function(docId, newStatus, email, phone, service, date, time) {
      try {
        // 1. Update Database
        await updateDoc(doc(db, "bookings", docId), {
          status: newStatus
        });

        // 2. Compose the Appointment Message
        let messageText = "";
        if (newStatus === "Accepted") {
          messageText = `Great news! Your appointment for ${service} on ${date} at ${time} has been CONFIRMED by the barber.\n\nWe look forward to seeing you at the shop!`;
        } else {
          messageText = `Unfortunately, your appointment request for ${service} on ${date} at ${time} was DECLINED due to full capacity.\n\nPlease visit our app or website to select another available time slot.`;
        }

        //  Send via Appointment Template (template_h03ryyc)
        try {
          if (window.emailjs) {
            await emailjs.send("service_abc123", "template_h03ryyc", {
              to_name: email.split("@")[0],
              to_email: email,
              appointment_details: messageText
            });
          }
        } catch (emailError) {
          console.warn("EmailJS notification error:", emailError);
        }

        //  Dispatch Native SMS
        const encodedMsg = encodeURIComponent(messageText);
        window.open(`sms:${phone}?body=${encodedMsg}`, '_blank');

        alert(`[DUAL NOTIFICATION DISPATCHED]\n\nStatus: ${newStatus.toUpperCase()}\n\n1. Email sent to: ${email}\n2. SMS dispatched to: ${phone}\n\nContent:\n"${messageText}"`);

        loadAppointments();
      } catch (err) {
        alert("Failed to update status: " + err.message);
      }
    };

    loadAppointments();
  </script>
</body>
</html>
